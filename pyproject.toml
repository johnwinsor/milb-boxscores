[project]
name = "milb-boxscores"
version = "0.2.0"
description = "Daily MLB/MiLB prospect box scores: scraper, SQLite store, and web app"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.34.2",
    "rich>=15.0.0",
]

[project.scripts]
milb = "milb.cli:main"

[dependency-groups]
dev = ["pytest>=8.3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/milb"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
